<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TradeLearn</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #FAFAFA;
            --bg-secondary: #F3F4F6;
            --bg-card: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --accent-color: #10B981;
            --border-color: #E5E7EB;
        }

        body.dark-mode {
            --bg-color: #111827;
            --bg-secondary: #1F2937;
            --bg-card: #1F2937;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: #374151;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .input-field {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .input-field:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        body.dark-mode .glass-card {
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 768px) {
            .glass-card {
                max-height: 90vh;
            }
        }
    </style>
</head>
<body class="min-h-screen min-h-[100dvh] w-full relative flex flex-col items-center justify-center p-4 sm:p-6 overflow-x-hidden">

    <!-- BACKGROUND EFFECTS -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -start-[10%] w-[50%] h-[50%] rounded-full bg-emerald-500/20 blur-[120px]"></div>
        <div class="absolute top-[60%] -end-[10%] w-[40%] h-[50%] rounded-full bg-blue-500/20 blur-[120px]"></div>
        <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%2310b981\' fill-opacity=\'0.03\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')]"></div>
    </div>

    <!-- CONTROLS WRAPPER (Sits above card on mobile, fixed in corner on desktop) -->
    <div class="w-full max-w-4xl flex justify-end items-center gap-2.5 mb-3 sm:mb-4 sm:fixed sm:top-6 sm:end-6 sm:w-auto sm:mb-0 z-30">
        <button id="theme-toggle" type="button" aria-label="Toggle theme" class="w-10 h-10 rounded-full bg-[var(--bg-card)] sm:bg-[var(--bg-secondary)] border border-[var(--border-color)] flex items-center justify-center text-[var(--text-main)] hover:bg-[var(--accent-color)] hover:text-white hover:border-[var(--accent-color)] shadow-sm transition-all">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
        <button id="rtl-btn" type="button" aria-label="Toggle direction" class="h-10 px-3.5 rounded-full bg-[var(--bg-card)] sm:bg-[var(--bg-secondary)] border border-[var(--border-color)] flex items-center justify-center text-[var(--text-main)] font-bold text-xs hover:bg-[var(--accent-color)] hover:text-white hover:border-[var(--accent-color)] shadow-sm transition-all">
            RTL
        </button>
    </div>

    <!-- CENTERED CARD -->
    <div class="glass-card w-full max-w-4xl rounded-[24px] flex flex-col md:flex-row overflow-hidden relative z-10 shadow-2xl">
        
        <!-- FORM SIDE -->
        <div class="w-full md:w-1/2 p-6 sm:p-10 flex flex-col justify-center md:overflow-y-auto">
            <div class="mb-6">
                <!-- LOGO -->
                <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold tracking-normal uppercase mb-5" style="color: var(--text-main) !important; text-decoration: none;">
                    <i class="fas fa-chart-line text-3xl" style="color: var(--accent-color);"></i>
                    TradeLearn
                </a>
                <h2 class="text-2xl font-black text-[var(--text-main)] mb-1">Welcome Back</h2>
                <p class="text-[var(--text-muted)] text-xs">Enter your details to access your dashboard.</p>
            </div>

            <!-- GOOGLE LOGIN -->
            <button type="button" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-[var(--bg-card)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm font-bold hover:bg-[var(--bg-secondary)] hover:border-gray-400 transition-all mb-3 shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
                Log in with Google
            </button>

            <!-- APPLE LOGIN -->
            <button type="button" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-[var(--bg-card)] border border-[var(--border-color)] rounded-lg text-[var(--text-main)] text-sm font-bold hover:bg-[var(--bg-secondary)] hover:border-gray-400 transition-all mb-5 shadow-sm">
                <i class="fab fa-apple text-lg mb-[1px]"></i>
                Log in with Apple
            </button>

            <div class="flex items-center gap-3 mb-5">
                <div class="flex-1 h-px bg-[var(--border-color)]"></div>
                <span class="text-[10px] font-bold text-[var(--text-muted)] uppercase tracking-wider">Or email</span>
                <div class="flex-1 h-px bg-[var(--border-color)]"></div>
            </div>

            <form action="user.html" method="GET" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-[var(--text-main)] mb-1 uppercase tracking-wide">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-[var(--text-muted)] text-xs"></i>
                        </div>
                        <input type="email" class="input-field w-full rounded-lg ps-8 pe-3 py-2 transition-all text-xs font-medium placeholder-[var(--text-muted)]" placeholder="alex@example.com" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold text-[var(--text-main)] mb-1 uppercase tracking-wide">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-[var(--text-muted)] text-xs"></i>
                        </div>
                        <input type="password" id="password-input" class="input-field w-full rounded-lg ps-8 pe-8 py-2 transition-all text-xs font-medium placeholder-[var(--text-muted)]" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="absolute inset-y-0 end-0 pe-2.5 px-2 flex items-center text-[var(--text-muted)] hover:text-[var(--accent-color)] transition-colors">
                            <i class="fas fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2 mt-1 mb-2">
                    <label class="flex items-center gap-2 cursor-pointer group mt-0.5">
                        <div class="relative flex items-center justify-center w-4 h-4 border-2 border-[var(--border-color)] rounded group-hover:border-[var(--accent-color)] transition-colors">
                            <input type="checkbox" class="peer opacity-0 absolute inset-0 cursor-pointer w-full h-full">
                            <i class="fas fa-check text-[10px] text-[var(--accent-color)] opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                        </div>
                        <span class="text-[11px] font-semibold text-[var(--text-muted)] select-none">Remember me</span>
                    </label>
                    <a href="#" class="text-[11px] font-bold text-[var(--accent-color)] hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full bg-[var(--accent-color)] hover:bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-lg shadow shadow-emerald-500/30 transition-all hover:-translate-y-0.5 mt-2 text-sm">
                    Log In
                </button>
            </form>

            <p class="text-center mt-5 text-xs font-semibold text-[var(--text-muted)]">
                Don't have an account yet? 
                <a href="signup.html" class="text-[var(--accent-color)] hover:underline ms-1">Create one now</a>
            </p>
        </div>

        <!-- IMAGE SIDE (Desktop Only) -->
        <div class="hidden md:flex md:w-1/2 relative bg-[var(--accent-color)] p-8 text-white flex-col justify-end overflow-hidden">
            <div class="absolute inset-0">
                <img src="images/stock (1).jpg" alt="Trading Screen" class="w-full h-full object-cover opacity-40 mix-blend-overlay">
                <div class="absolute inset-0 bg-gradient-to-t from-[#111827] via-transparent to-transparent opacity-90"></div>
            </div>
            <div class="relative z-10 mt-auto">
                <div class="text-3xl text-emerald-300 mb-2 opacity-80"><i class="fas fa-quote-left rtl:rotate-180 inline-block"></i></div>
                <p class="text-lg font-bold leading-snug mb-4">"Master the Markets. Transform Your Future. Access elite strategies trusted by Wall Street."</p>
                
                <div class="flex items-center gap-3">
                    <div class="flex -space-x-3 rtl:space-x-reverse">
                        <img class="w-8 h-8 rounded-full border-2 border-gray-900" src="images/about4.jpg" alt="User">
                        <img class="w-8 h-8 rounded-full border-2 border-gray-900" src="images/about5.jpg" alt="User">
                        <img class="w-8 h-8 rounded-full border-2 border-gray-900" src="images/about6.jpg" alt="User">
                    </div>
                    <div class="text-[10px] text-gray-300 font-medium">Join 50,000+ Traders</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Password toggle
        const toggleBtn = document.getElementById('toggle-password');
        const passInput = document.getElementById('password-input');
        
        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passInput.type === 'password';
                passInput.type = isPassword ? 'text' : 'password';
                toggleBtn.innerHTML = isPassword 
                    ? '<i class="fas fa-eye-slash text-xs"></i>' 
                    : '<i class="fas fa-eye text-xs"></i>';
            });
        }

        // Theme logic
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const savedTheme = localStorage.getItem('theme') || 'light';

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.className = 'fas fa-sun';
        }

        themeBtn.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });
    
        // RTL Logic
        const rtlBtn = document.getElementById('rtl-btn'); 
        const currentDir = localStorage.getItem('dir') || 'ltr';
        
        function updateRTLUI(dirVal) {
            if (rtlBtn) {
                rtlBtn.innerText = dirVal === 'rtl' ? 'LTR' : 'RTL';
            }
        }

        document.documentElement.dir = currentDir; 
        updateRTLUI(currentDir);
        
        if (rtlBtn) {
            rtlBtn.addEventListener('click', () => {
                const isRTL = document.documentElement.dir === 'rtl'; 
                const newDir = isRTL ? 'ltr' : 'rtl';
                document.documentElement.dir = newDir; 
                localStorage.setItem('dir', newDir); 
                updateRTLUI(newDir);
            });
        }
    </script>
</body>
</html>
